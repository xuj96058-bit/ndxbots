[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndxbots"
version = "0.1.0"
description = "纳斯达克100本地量化平台"
requires-python = ">=3.10"
dependencies = [
  "futu-api>=9.0.0",
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
