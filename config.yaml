  nhnl_window: 20
  rsi_window: 14
  ew_window: 60
  top_amount: 10
  min_names: 40
  breadth_weight: 0.7
  leverage_weight: 0.3
  hot: 0.8
  cold: 0.2
  split: 0.5
  leverage_lag_days: 21
  use_gross_ladder: true
  gross_smooth: 5
  gross_ladder_start: 0.35
  gross_ladder_step: 0.05
  gross_step: 0.10
  gross_floor: 0.60
  dual_hot: 0.80

backtest:
  start: "2018-01-01"
  end: null
  cost_bps: 10
  exec: next_close
  initial_cash: 20000
