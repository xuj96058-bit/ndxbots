futu:
  host: 127.0.0.1
  port: 11111

data:
  root: data
  kline_start: "2016-01-01"
  request_sleep_sec: 0.35
  max_count: 1000

universe:
  # 优先用富途板块拉当前成分；失败则用内置兜底名单
  prefer_futu_plate: true
  plate_keywords:
    - 纳斯达克100
    - 纳斯达克 100
    - NASDAQ 100
    - NASDAQ-100
    - NDX
  benchmark: US.QQQ
  extra_codes:
    - US.QQQ

# 选股层：日线因子 → 观察池。执行层（15m / v7）只许盯池内股票。
strategy:
  factors:
    - my_ma50_gap
    - my_struct_gap
  invert: []                 # 负 IC 才把因子名放这里
  top_n: 10
  require_above_ma200: true  # 新开多仍须在 MA200 上方；走平沿用旧多时允许留在缓冲带
  allow_short: true          # true = 允许空头池
  ma200_buffer: 0.015        # 新开仓：收盘须离开 MA200 至少 1.5%
  slope_atr_strong: 1.5      # |Slope_ATR| 大于此为强趋势，允许新开
  slope_atr_flat: 0.5        # |Slope_ATR| 小于此为走平（与强档互斥）
  slope_pct_floor: 0.0025    # |s_20| 小于 0.25% 强制走平，避免微噪被 ATR 放大
  slope_weak_no_new: true    # 弱趋势只留旧仓，不纳新票
  flat_keep_prev: true       # 走平沿用昨天方向；false = 走平强制空仓
  space_col: my_dd_from_high_21
  space_min: -0.12           # 多头：离 21 日高最多回撤 12%
  space_max: -0.01           # 多头：至少离开高点 1%，避免追顶
  short_space_col: my_dist_from_low_21
  short_space_min: 0.01      # 空头：至少离开 21 日低 1%，避免追水清盘
  short_space_max: 0.12      # 空头：离低点反弹不超过 12%，避免结构已修复
  min_atr_pct: 0.010
  max_hold: 4                # 每侧最多同时持有；观察池仍是每侧 top_n

backtest:
  start: "2018-01-01"
  end: null
  cost_bps: 10               # 单边滑点+佣金，单位 bp
  exec: next_close           # T 日收盘定池，T+1 收益用滞后权重
  initial_cash: 20000
