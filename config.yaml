    - my_ma50_gap
    - my_struct_gap
  invert: []
  top_n: 10
  require_above_ma200: true
  allow_short: true
  ma200_buffer: 0.015
  slope_atr_strong: 1.5
  slope_atr_flat: 0.5
  slope_pct_floor: 0.0025
  slope_weak_no_new: true
  flat_keep_prev: true
  space_col: my_dd_from_high_21
  space_min: -0.12
  space_max: -0.01
  short_space_col: my_dist_from_low_21
  short_space_min: 0.01
  short_space_max: 0.12
  min_atr_pct: 0.010
  max_hold: 4
  min_hold_days: 10
  keep_rank: 8
  macd_gate: false
  rsi_gate: true
  rsi_long_max: 75
  rsi_short_min: 25
  bb_width_gate: true
  bb_width_min: null
  bb_width_pct_min: 0.20
  qqq_regime_gate: true
  qqq_ret_col: ret_21
  qqq_rally_ret: 0.06
  qqq_dump_ret: -0.06
  qqq_chop_ret: 0.03
  qqq_chop_width: 0.08
