futu:
  host: 127.0.0.1
  port: 11111

data:
  root: data
  kline_start: "2016-01-01"
  request_sleep_sec: 0.35
  max_count: 1000

universe:
  prefer_futu_plate: true
  plate_keywords:
    - 纳斯达克100
    - 纳斯达克 100
    - NASDAQ 100
    - NASDAQ-100
